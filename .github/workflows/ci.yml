name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uvx ruff check .

  test:
    runs-on: ubuntu-24.04
    env:
      HH_API_ACCESS_TOKEN: placeholder
      DATABASE_URL: postgresql+asyncpg://u:p@localhost:5432/db  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest tests/ --cov=app --cov-report=term
